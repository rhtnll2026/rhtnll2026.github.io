/* Alignment */
mtable.right-align mtd,
mtable mtd.right-align,
mtable.left-align mtd.right-align,
mtable.aligned mtd:nth-child(odd) {
  justify-items: end;
  text-align: right;
}
mtable.cases mtd,
mtable.left-align mtd,
mtable mtd.left-align,
mtable.aligned mtd:nth-child(even),
math:is(:not([display])) > mtable.multiline-equation mtd {
  justify-items: start;
  text-align: left;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.left-flush {
  padding-left: 0;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.right-flush {
  padding-right: 0;
}

/* Tables */
mtable {
  math-style: inherit;
}
mtd {
  math-depth: auto-add;
  math-style: compact;
  math-shift: compact;
}

/* Equations */
mtable.multiline-equation mtd {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
  padding: 0;
}
math > mtable.multiline-equation mtr:not(:last-child) mtd {
  padding-bottom: 0.5em;
}

/* Fractions */
mfrac {
  padding-inline: 0;
  margin-inline: 0.1em;
}

/* Accents */
mover[accent="true" i] > :first-child {
  font-feature-settings: "dtls";
}
mover.dotted[accent="true" i] > :first-child {
  font-feature-settings: "dtls" 0;
}

/* Other rules for scriptlevel, displaystyle and math-shift */
munder > :nth-child(2),
munderover > :nth-child(2) {
  math-shift: compact
}
munder[accentunder="true" i] > :not(:first-child),
mover[accent="true" i] > :not(:first-child) {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
}

  .page-reading-content math[display="block"]{
    font-size:max(1.18em,1.25rem);
  }
  /* The native compact fraction spacing remains; its contents no longer shrink
     recursively. Explicit sizes override the UA's font-size:math scaling only. */
  .page-reading-content math mfrac>*{font-size:inherit}
  .page-reading-content math :is(msub,msup,msubsup,mmultiscripts,munder,mover,munderover)>:not(:first-child){
    font-size:max(.75em,.8125rem);
  }
  .page-reading-content math mroot>:nth-child(2){font-size:max(.7em,.8125rem)}
  /* Preserve native full-size accents when the MathML explicitly requests them. */
  .page-reading-content math :is(mover[accent="true"]>:nth-child(2),munder[accentunder="true"]>:nth-child(2),munderover[accentunder="true"]>:nth-child(2),munderover[accent="true"]>:nth-child(3)){

  }
  /* Equation-alignment cells should inherit their enclosing mathematical depth. */
  .page-reading-content math mtd{math-depth:inherit}
  /* Reserve a little more descender room for enlarged glyphs and horizontal scrollbars. */
  .page-reading-content :is(.math-block-scroll,.equation-scroll,.equation,.display-equation){padding-bottom:calc(.6em + 6px)}
}



/* Keep the native MathML formatting context in both screen and print output.
   Plain display:block turns direct operands into separate HTML-style blocks;
   e.g. the six siblings in the 2018 Q21 inequality become a vertical pile.
   Scrolling belongs to the surrounding HTML wrapper, not to the math tree. */
.page-reading-content math{
  display:inline math;
  white-space:nowrap;
  overflow-wrap:normal;
  word-break:normal;
  line-height:normal;
}
.page-reading-content math[display="block"]{
  display:block math;
}



/* An option is one label/body row. Only whole options wrap in their group. */
.page-reading-content .option{flex-wrap:nowrap}
.page-reading-content .option-label{flex:0 0 auto;white-space:nowrap}
.page-reading-content .option-body{min-width:0}
/* Avoid the extra text-line descent inside the old inline-block math wrapper.
   Keep the scroll viewport and the native MathML formatting context intact. */
.page-reading-content .option .inline-equation{
  display:inline-flex;
  align-items:center;
  vertical-align:middle;
}
.page-reading-content .option .inline-equation>math{flex:0 0 auto}
@media screen{
  /* Replace the former text-line strut with explicit ink room. Some accents
     paint beyond MathML's reported content height; do not clip them. */
  .page-reading-content .option .inline-equation{
    box-sizing:border-box;
    min-height:2.4em;
  }
}
/* A single expression aligns by its full height, including stacked fractions.
   Mixed prose keeps first-line baseline alignment, even when it wraps. */
.page-reading-content .option-math-only{align-items:center}
.page-reading-content .option-math-only>.option-body{
  display:flex;
  align-items:center;
}
